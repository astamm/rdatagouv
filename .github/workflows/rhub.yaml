# R-hub's generic GitHub Actions workflow file. It's canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# You can update this file to a newer version using the rhub2 package:
#
# rhub::rhub_setup()
#
# It is unlikely that you need to modify this file manually.

name: R-hub
run-name: >-
  ${{ github.event.inputs.id || format('Manual run by @{0}', github.triggering_actor) }}:
  ${{ github.event.inputs.name || github.event.inputs.config }}

on:
  workflow_dispatch:
    inputs:
      config:
        description: >-
          Comma-separated list of R-hub platforms to use.
          Full list: https://r-hub.github.io/containers/
        type: string
        default: 'linux,windows,macos'
      name:
        description: 'Run name. You can leave this empty.'
        type: string
      id:
        description: 'Unique ID. You can leave this empty.'
        type: string

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
    # NO NEED TO CHECKOUT HERE
    - uses: r-hub/actions/setup@v1
      with:
        config: ${{ github.event.inputs.config }}
      id: rhub-setup

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
        # TEMPORARY: exclude the R-devel containers still pinned to a broken
        # snapshot. These images carry R-devel r89629 (2026-03-15) / r89623
        # (2026-03-14), which predates the `R_envSymbols` header symbol added
        # in r89633 by hours. Current rlang (>= 1.1.7 on CRAN, any release
        # >= 1.2.0/maint) cannot compile from source against those headers
        # ("implicit declaration of function 'R_envSymbols'"), and the
        # "Build dependencies from source" step below must force source builds
        # to avoid r-hub's miscompiled prebuilt binaries. `c23` also carries
        # r89623 and failed identically (rlang 1.3.0 source build). This is a
        # transient upstream condition: the containers fail only until r-hub
        # rebuilds them past r89633. Drop this block (and re-enable the full
        # matrix) once these images move off the stale snapshot. The
        # newer-snapshot devel containers (clang-asan/ubsan, clang21/22,
        # gcc-asan, gcc16, ubuntu-*) still provide R-devel coverage.
        #
        # Added 2026-08-22 (run 32598239019): `noremap` (ubuntu-22.04/4.6,
        # R-devel 4.6.0) and `intel` (fedora-38/4.6, R-devel 4.6.0) are
        # additional stale-snapshot containers excluded for the same reason. In
        # this run rlang 1.3.0 failed on `noremap` with the exact documented
        # "implicit declaration of function 'R_envSymbols'" error, and magrittr
        # 2.0.5 failed on `intel` with "use of undeclared identifier
        # 'R_MakeDelayedBinding'" (a still-newer symbol than `R_envSymbols`),
        # i.e. the same stale snapshot family hitting a different package.
        #
        # NB: clang21 (R-devel r90185) is excluded from the above rationale but
        # is separately unreliable right now: its prebuilt `bit64` binary (from
        # the r-hub CRAN mirror) links against libclang_rt.ubsan_standalone,
        # which is missing at load time, so readr-based table parsing fails at
        # test/vignette time there too.
        #
        # `rchk` is excluded too, but for a different reason: it is not a stale
        # snapshot (ubuntu-22.04/4.7, R-devel 4.7.0). rchk analyzes native code
        # for memory-protection errors, and `datagouv` is a pure-R package with
        # no src/ directory, so `rchk.sh` produces no `.so.bcheck` output and
        # the run-check action aborts with "bcheck output file does not exist".
        # It can never pass for this package (no compiled code to analyze), so
        # it provides no signal here.
        exclude:
          - config:
              name: c23
          - config:
              name: clang16
          - config:
              name: clang17
          - config:
              name: clang18
          - config:
              name: clang19
          - config:
              name: clang20
          - config:
              name: gcc13
          - config:
              name: gcc14
          - config:
              name: gcc15
          - config:
              name: intel
          - config:
              name: noremap
          - config:
              name: rchk
    container:
      image: ${{ matrix.config.container }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - name: Install wget and gdebi (Linux container)
        run: |
          if command -v apt-get &> /dev/null; then
            apt-get update -y && apt-get install -y wget gdebi-core
          elif command -v dnf &> /dev/null; then
            dnf install -y wget
          elif command -v yum &> /dev/null; then
            yum install -y wget
          fi
      - name: Install Quarto (Linux container)
        run: |
          QUARTO_VERSION="1.9.38"
          if command -v apt-get &> /dev/null; then
            curl -L -o quarto.deb "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.deb"
            gdebi --non-interactive quarto.deb
          elif command -v dnf &> /dev/null; then
            # Quarto publishes the RPM under the x86_64 arch tag (the .deb keeps amd64);
            # the linux-amd64.rpm name does not exist and 404s.
            curl -L -o quarto.rpm "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-x86_64.rpm"
            dnf install -y quarto.rpm
          elif command -v yum &> /dev/null; then
            curl -L -o quarto.rpm "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-x86_64.rpm"
            yum install -y quarto.rpm
          fi
      # R-hub Linux containers can ship prebuilt CRAN binary packages (from the
      # r-hub/repos mirror) built against a different compiler/R configuration
      # than the container itself. Loading those miscompiled packages (e.g.
      # vctrs via dplyr/tibble/readr) fails at vignette build time with
      # "symbol bindings not supported yet". Force pak to install only source
      # deliverables so every package is compiled against the container's R.
      # This is the `platforms` config entry (see pak/pkgdepends docs), set as
      # an R option which `setup-deps` (pak) reads.
      - name: Build dependencies from source (containers)
        env:
          RHUB_RPROFILE: ${{ github.workspace }}/.rhub-Rprofile.site
        run: |
          printf 'options(pkg.platforms = "source")\n' \
            > "$RHUB_RPROFILE"
          echo "R_PROFILE=$RHUB_RPROFILE" >> "$GITHUB_ENV"
          echo "PKG_PLATFORMS=source" >> "$GITHUB_ENV"
      - uses: r-hub/actions/setup-deps@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      # clang21-only repair. The r-hub CRAN *binary* `bit64` links against
      # libclang_rt.ubsan_standalone, which is missing at load time inside this
      # clang21 container, so any readr-based table parse fails at
      # test/vignette time. The "Build dependencies from source" step above is
      # correct (pak solves for the source platform), but it is silently
      # defeated by the r-lib actions/cache: the cache key is stable because
      # bit64's version is unchanged, so the poisoned *binary* `bit64.so` is
      # restored from cache every run and pak's lockfile install only fills the
      # 1-package gap without ever recompiling it. Fix: drop the cached bit64
      # out of R_LIBS_USER and force a source rebuild in-container, which links
      # against the container's native toolchain. The post-run cache step then
      # saves the repaired library, so later runs restore the good bit64.
      # NOTE: pak-based reinstalls do NOT work here. `pak::pkg_install
      # ("bit64=?source")` is a no-op when bit64 4.8.4 is already installed:
      # pak's solver treats the pinned version as satisfied regardless of
      # source/binary origin and reports "No downloads are needed" (observed
      # 2026-08-22, run 32561306626), leaving the poisoned binary untouched.
      # The reliable way to force a genuine source recompile is to bypass pak's
      # up-to-date check: install the CRAN source tarball directly with
      # install.packages(type="source", repos=NULL), which always compiles from
      # source and links against the container's native toolchain.
      - name: Force source rebuild of bit64 (clang21 ubsan workaround)
        if: ${{ matrix.config.name == 'clang21' }}
        env:
          R_LIBS_USER: ${{ env.R_LIBS_USER }}
        run: |
          Rscript -e '
            lib <- Sys.getenv("R_LIBS_USER")
            url <- "https://cran.r-project.org/src/contrib/bit64_4.8.4.tar.gz"
            dest <- file.path(tempdir(), "bit64_4.8.4.tar.gz")
            cat("bit64 in ", lib, ": ", "bit64" %in% rownames(installed.packages(lib = lib)), "\n", sep = "")
            download.file(url, dest, quiet = TRUE)
            install.packages(dest, lib = lib, repos = NULL, type = "source")
            cat("installed bit64 from source: ", "bit64" %in% rownames(installed.packages(lib = lib)), "\n", sep = "")
          '
      # nosuggests-only repair. This fresh-snapshot R-devel container
      # (fedora-42/4.7) is NOT stale (its setup-deps step builds magrittr/rlang
      # fine), but its cached `processx` binary is poisoned exactly the way
      # clang21's cached `bit64` was (see the bit64 step above): a
      # previously-cached `processx.so` links against `libasan.so.8`, which is
      # missing at load time here, so loading any package that depends on
      # processx (e.g. rcmdcheck/rcmdcheck -> callr -> processx) fails with
      # "libasan.so.8: cannot open shared object file" during the check step,
      # before the test suite runs. The "Build dependencies from source" step
      # above does not help because the cache restores the poisoned binary and
      # pak's lockfile install sees the version as already-satisfied. Fix:
      # drop the cached processx out of R_LIBS_USER and force a source rebuild
      # from the CRAN tarball, which links against the container's native
      # toolchain. The post-run cache step then saves the repaired library.
      - name: Force source rebuild of processx (nosuggests libasan workaround)
        if: ${{ matrix.config.name == 'nosuggests' }}
        env:
          R_LIBS_USER: ${{ env.R_LIBS_USER }}
        run: |
          Rscript -e '
            lib <- Sys.getenv("R_LIBS_USER")
            url <- "https://cran.r-project.org/src/contrib/processx_3.9.0.tar.gz"
            dest <- file.path(tempdir(), "processx_3.9.0.tar.gz")
            cat("processx in ", lib, ": ", "processx" %in% rownames(installed.packages(lib = lib)), "\n", sep = "")
            download.file(url, dest, quiet = TRUE)
            install.packages(dest, lib = lib, repos = NULL, type = "source")
            cat("installed processx from source: ", "processx" %in% rownames(installed.packages(lib = lib)), "\n", sep = "")
            ## verify the DLL no longer links against the missing libasan runtime
            dll <- file.path(lib, "processx", "libs", paste0("processx", .Platform$dynlib.ext))
            cat("ldd processx:", system(paste("ldd", dll), intern = TRUE), "\n")
          '
      - uses: r-hub/actions/run-check@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      # Explicitly install Quarto (r-hub's setup-deps passes install-quarto:
      # false, so Windows/macOS would otherwise lack Quarto for the vignette)
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38
      - uses: r-hub/actions/setup-deps@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/run-check@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
